name: Build launcher backup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Publish self-contained launcher
        run: dotnet publish SavourLauncher.csproj --configuration Release --runtime win-x64 --self-contained true --output artifact

      - name: Archive launcher backup
        run: Compress-Archive -Path artifact\* -DestinationPath IDIOTCORD-LAUNCHER-${{ github.sha }}-windows.zip

      - name: Upload launcher backup
        uses: actions/upload-artifact@v4
        with:
          name: IDIOTCORD-LAUNCHER-${{ github.sha }}-windows
          path: IDIOTCORD-LAUNCHER-${{ github.sha }}-windows.zip